<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b2a6f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
:root{--win:#f3f3f3;--card:#fff;--tx:#1b1b1b;--bar:rgba(243,243,243,.85);--bd:#d4d4d4;--acc:#0067c0;--hv:rgba(0,0,0,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--win:#202020;--card:#2c2c2c;--tx:#f5f5f5;--bar:rgba(32,32,32,.85);--bd:#3c3c3c;--acc:#4cc2ff;--hv:rgba(255,255,255,.1)}}
:root[data-theme=dark]{--win:#202020;--card:#2c2c2c;--tx:#f5f5f5;--bar:rgba(32,32,32,.85);--bd:#3c3c3c;--acc:#4cc2ff;--hv:rgba(255,255,255,.1)}
html,body{margin:0;height:100%;overflow:hidden;font:14px "Segoe UI",system-ui,sans-serif;color:var(--tx);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#desk,#lock{position:fixed;inset:0;background:var(--wp);background-size:cover}
#ic{position:absolute;top:env(safe-area-inset-top,0px);left:0;bottom:60px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;padding:8px}
.ic{width:78px;padding:6px 2px;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 3px #000;border-radius:6px}
.ic span{display:block;font-size:34px}.ic:active{background:rgba(255,255,255,.25)}
.win{position:absolute;background:var(--win);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.win.mn{display:none}
.win.mx{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px - env(safe-area-inset-bottom,0px))!important;border-radius:0}
.tb{height:36px;display:flex;align-items:center;padding-left:10px;background:var(--card);touch-action:none}
.tb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb b{width:44px;height:36px;display:grid;place-items:center;font-weight:400}
.tb b:hover{background:var(--hv)}.tb b.cl:hover{background:#c42b1c;color:#fff}
.bd{flex:1;min-height:0;position:relative;overflow:auto}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-top:1px solid var(--bd);display:flex;align-items:center;z-index:9999}
#mid{flex:1;display:flex;justify-content:center;gap:2px;padding-left:100px}
.tk{width:44px;height:40px;border-radius:6px;display:grid;place-items:center;font-size:22px;position:relative}
.tk:hover,.tk.fo{background:var(--hv)}
.tk.on::after{content:"";position:absolute;bottom:2px;width:12px;height:3px;border-radius:2px;background:var(--acc)}.tk.fo::after{width:20px}
.lg{display:grid;grid-template-columns:9px 9px;gap:2px}.lg i{width:9px;height:9px;background:#0a84ff}
#th{width:36px;text-align:center;font-size:18px}
#clk{width:68px;text-align:center;font-size:12px;line-height:1.3}
.pop{position:fixed;background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:12px;padding:14px;display:none;z-index:9998;box-shadow:0 12px 40px rgba(0,0,0,.35);bottom:calc(58px + env(safe-area-inset-bottom,0px))}
.pop.on{display:block}
#sm{left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 16px))}
#cal{right:8px;width:min(290px,calc(100% - 16px))}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ch b{padding:4px 12px;font-weight:400}
.cgd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}.cgd i{font-style:normal;padding:7px 0;border-radius:50%}.cgd i.td{background:var(--acc);color:#fff}
#sm input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.ga{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:90px;align-content:start}
.ga div{text-align:center;padding:8px 2px;border-radius:8px;font-size:12px}.ga div:hover{background:var(--hv)}.ga div span{display:block;font-size:28px}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.ft b{width:40px;height:36px;display:inline-grid;place-items:center;border-radius:6px;font-size:18px;font-weight:400}.ft b:hover{background:var(--hv)}
#lock{z-index:99998;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);display:grid;place-items:center;text-align:center;transition:transform .4s}
#lock.up{transform:translateY(-100%)}#lt{font-size:72px;font-weight:300}#lock p{opacity:.85}
#off{position:fixed;inset:0;background:#000;color:#fff;display:none;place-items:center;z-index:99999;text-align:center}#off.on{display:grid}
#off i{display:block;width:34px;height:34px;margin:0 auto 14px;border:4px solid #444;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#off i{animation:none}#lock{transition:none}}
.cc,.pa,.sk,.ex{display:flex;flex-direction:column;height:100%}
.cd{flex:0 0 84px;padding:10px 14px;text-align:right;font-size:34px;font-weight:600;overflow:hidden;word-break:break-all}
.cg{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:3px;padding:4px}
.cg button{border:0;border-radius:6px;background:var(--card);color:var(--tx);font-size:18px}.cg button:active{opacity:.6}.cg .op{background:var(--acc);color:#fff}
.pt{display:flex;gap:6px;padding:6px;align-items:center;background:var(--card)}
.pt input[type=range]{flex:1}.pa canvas{flex:1;min-height:0;width:100%;touch-action:none;background:#fff}
button{font:inherit}.pt button,.st button,.dp button,.tr button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:6px 10px}
.tx{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--win);color:var(--tx);font:inherit;-webkit-user-select:text;user-select:text}
.pa textarea{flex:1;min-height:0;border:0;resize:none;padding:10px;background:var(--win);color:var(--tx);font:15px Consolas,monospace;outline:0;-webkit-user-select:text;user-select:text}
.sk{align-items:center;gap:8px;padding:8px}.sk canvas{max-width:100%;background:#111;border-radius:6px;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:4px}.dp button{height:44px}
.mg{display:grid;grid-template-columns:repeat(9,32px);gap:2px}
.mc{width:32px;height:32px;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);border-radius:4px;font-weight:700}.mc.o{background:var(--win)}
.fl{flex:1;overflow:auto;padding:4px}.fr{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:6px}.fr:hover{background:var(--hv)}
.fr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr b{padding:2px 10px;font-weight:400;opacity:.6}.em{padding:20px;text-align:center;opacity:.6}
.tr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd)}.tr span{flex:1}
.st{padding:14px}.st h3{margin:8px 0 10px;font-size:14px}.st p{opacity:.7;margin:14px 0 0}
.wp{display:flex;gap:8px;margin-bottom:10px}.wp div{flex:1;height:54px;border-radius:8px;border:2px solid var(--bd)}
</style></head><body>
<div id="desk"><div id="ic"></div></div>
<div id="sm" class="pop"><input id="q" placeholder="Search apps" autocomplete="off"><div class="ga" id="ga"></div>

files:{n:'File Explorer',i:'📁',w:360,h:430,r(b,h){

  b.innerHTML='<div class=ex><div class=pt><button>◀</button><span></span></div><div class=pt><input class=tx placeholder="Name"><button>+ Folder</button><button>+ File</button></div><div class=fl></div></div>';

note:{n:'Notepad',i:'📝',w:340,h:400,r(b,h,arg){
 const path=arg&&arg.path,d=path?path.slice(0,-1).reduce((o,k)=>o[k],FS):(FS.Documents||(FS.Documents={}));
 b.innerHTML='<div class=pa><div class=pt><input class=tx placeholder="File name"><button>Save</button><span></span></div><textarea placeholder="Start typing…"></textarea></div>';
 const nm=$('.tx',b),ta=$('textarea',b),sv=$('span',b);
 nm.value=path?path[path.length-1]:'untitled.txt';ta.value=path?d[nm.value]||'':'';

paint:{n:'Paint',i:'🎨',w:340,h:430,r(b){
 b.innerHTML='<div class=pa><div class=pt><input type=color value=#0067c0><input type=range min=1 max=30 value=4><button>Eraser</button><button>Clear</button></div><canvas></canvas></div>';
 const c=$('canvas',b),x=c.getContext('2d'),[k,z]=$$('input',b),[eb,cb]=$$('button',b),wipe=()=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)};let er=0;

 b.innerHTML='<div class=sk><div>Score: <b>0</b></div><canvas width=300 height=300></canvas><div class=dp><i></i><button>▲</button><i></i><button>◀</button><button>▼</button><button>▶</button></div></div>';
 const c=$('canvas',b),x=c.getContext('2d'),sc=$('b',b);let s,d,f,pt;

 const reset=()=>{s=[[7,7],[6,7],[5,7]];d=[1,0];pt=0;sc.textContent=0;food()};
 const dir=(a,e)=>{if(a+d[0]||e+d[1])d=[a,e]};
 const [u,l,dn,r]=$$('button',b);u.onclick=()=>dir(0,-1);l.onclick=()=>dir(-1,0);dn.onclick=()=>dir(0,1);r.onclick=()=>dir(1,0);
 const kd=e=>{if(top_!==W.snake)return;const m={ArrowUp:[0,-1],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowRight:[1,0]}[e.key];if(m)dir(...m)};document.addEventListener('keydown',kd);
 let sx,sy;c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
 c.onpointerup=e=>{const a=e.clientX-sx,v=e.clientY-sy;if(Math.abs(a)>Math.abs(v))dir(a>0?1:-1,0);else dir(0,v>0?1:-1)};
 const tick=()=>{const g=[s[0][0]+d[0],s[0][1]+d[1]];
  if(g[0]<0||g[1]<0||g[0]>14||g[1]>14||s.some(q=>q[0]==g[0]&&q[1]==g[1]))reset();
  else{s.unshift(g);if(g[0]==f[0]&&g[1]==f[1]){sc.textContent=++pt;food()}else s.pop()}

mine:{n:'Minesweeper',i:'💣',w:330,h:450,r(b){
 const N=9,M=10,CL=['','#1976d2','#388e3c','#d32f2f','#7b1fa2','#ff8f00','#00838f','#555','#777'];let g,over,first,fm=0;
 b.innerHTML='<div class=sk><div class=pt style="width:100%"><button>⛏ Dig</button><button>🙂 New</button><span></span></div><div class=mg></div></div>';
 const G=$('.mg',b),st=$('span',b),[fb,nb]=$$('button',b);
 const nei=i=>{const r=i/N|0,c=i%N,a=[];for(let y=-1;y<2;y++)for(let x=-1;x<2;x++){const rr=r+y,cc=c+x;if((y||x)&&rr>=0&&rr<N&&cc>=0&&cc<N)a.push(rr*N+cc)}return a};
 const place=s=>{let k=0;while(k<M){const i=Math.random()*N*N|0;if(i!=s&&!g[i].m){g[i].m=1;k++}}g.forEach((c,i)=>c.n=nei(i).filter(j=>g[j].m).length)};

  g.forEach((c,i)=>{const d=document.createElement('div');d.className='mc'+(c.o?' o':'');d.textContent=c.o?(c.m?'💥':c.n||''):c.f?'🚩':over&&c.m?'💣':'';d.style.color=CL[c.n]||'';

task:{n:'Task Manager',i:'📊',w:340,h:360,r(b,h){

set:{n:'Settings',i:'⚙️',w:320,h:380,r(b){
 b.innerHTML='<div class=st><h3>Wallpaper</h3><div class=wp></div><h3>Theme</h3><button class=tg>Switch light / dark</button><h3>Accent color</h3><input type=color value=#0067c0><h3>Files</h3><button class=rs>Reset files</button><p>Windows Web Edition</p></div>';
 WP.forEach(g=>{const d=document.createElement('div');d.style.background=g;d.onclick=()=>setWP(g);$('.wp',b).append(d)});
 $('.tg',b).onclick=theme;$('input',b).oninput=e=>R.style.setProperty('--acc',e.target.value);$('.rs',b).onclick=()=>{FS=def();save()}}}
};

 const o=W[key]={e,k,a,t,h:{}};
